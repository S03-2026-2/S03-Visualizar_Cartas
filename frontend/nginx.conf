server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O upstream é resolvido na hora da requisição (DNS interno do Docker em
    # 127.0.0.11) para que o container suba mesmo sem o serviço "backend"
    # — com proxy_pass fixo o nginx aborta o start com "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
